# Local-dev broker: open, unauthenticated, with disk persistence enabled
# so messages queued for an offline durable subscriber (like bronze-writer,
# which now uses a persistent session) survive a broker restart too, not
# just a subscriber restart.
# Production notes: enable password_file / TLS (port 8883).
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
log_type error
log_type warning
